<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Deadwire recovery intelligence walkthrough</title>
  <desc id="description">An animated product walkthrough: failed DLQ executions become one incident, unknown payment risk blocks replay, then a safe recovery canary proceeds.</desc>
  <style>
    .bg{fill:#090d13}.panel{fill:#131a25;stroke:#2a3a50;stroke-width:1}.muted{fill:#91a1b6;font:500 16px system-ui,sans-serif}.small{fill:#91a1b6;font:600 12px system-ui,sans-serif;letter-spacing:2px}.head{fill:#edf1f6;font:700 35px system-ui,sans-serif;letter-spacing:-1px}.label{fill:#e7edf5;font:650 16px system-ui,sans-serif}.mono{fill:#c7d6e8;font:14px ui-monospace,SFMono-Regular,monospace}.blue{fill:#70c5ff}.amber{fill:#ffb76d}.green{fill:#75ddb0}.line{stroke:#38516d;stroke-width:2;fill:none}.dot{fill:#ff8f88}.safe{fill:#75ddb0}.warn{fill:#ffb76d}.fade{opacity:0}.phase1{animation:show 20s infinite}.phase2{animation:show2 20s infinite}.phase3{animation:show3 20s infinite}.phase4{animation:show4 20s infinite}.move1{animation:collapse 20s infinite;transform-box:fill-box;transform-origin:center}.draw{stroke-dasharray:310;stroke-dashoffset:310;animation:draw 20s infinite}.pulse{animation:pulse 20s infinite}.scan{animation:scan 20s infinite}.counter{animation:counter 20s infinite}.card{animation:card 20s infinite}.tag{animation:tag 20s infinite}@keyframes show{0%,23%{opacity:1}25%,100%{opacity:0}}@keyframes show2{0%,24%{opacity:0}27%,48%{opacity:1}51%,100%{opacity:0}}@keyframes show3{0%,51%{opacity:0}54%,73%{opacity:1}76%,100%{opacity:0}}@keyframes show4{0%,76%{opacity:0}79%,98%{opacity:1}100%{opacity:0}}@keyframes collapse{0%,20%{transform:translate(0,0);opacity:1}28%,100%{transform:translate(335px,96px);opacity:0}}@keyframes draw{0%,28%{stroke-dashoffset:310;opacity:0}36%,48%{stroke-dashoffset:0;opacity:1}52%,100%{opacity:0}}@keyframes pulse{0%,53%{opacity:0;transform:scale(.8)}58%,70%{opacity:1;transform:scale(1)}73%,100%{opacity:0}}@keyframes scan{0%,79%{opacity:0;transform:translateX(0)}83%,95%{opacity:.65;transform:translateX(190px)}98%,100%{opacity:0}}@keyframes counter{0%,1%{opacity:0}4%,21%{opacity:1}24%,100%{opacity:0}}@keyframes card{0%,24%{opacity:0}28%,47%{opacity:1}50%,100%{opacity:0}}@keyframes tag{0%,54%{opacity:0}58%,72%{opacity:1}75%,100%{opacity:0}}</style>
  <rect class="bg" width="1200" height="675"/>
  <text x="62" y="70" class="small blue">DEADWIRE / RECOVERY INTELLIGENCE</text>
  <text x="62" y="113" class="head">From failed runs to a safe recovery decision.</text>
  <text x="62" y="145" class="muted">An Upstash Workflow + QStash recovery walkthrough</text>
  <rect x="62" y="182" width="1076" height="420" rx="12" class="panel"/>
  <!-- phase 1: individual failed runs -->
  <g class="phase1"><text x="95" y="224" class="small amber">01 / DLQ ACCUMULATION</text><text x="95" y="257" class="label">8,147 failed executions are operationally ambiguous.</text><g class="counter"><text x="944" y="254" class="amber" style="font:700 27px system-ui,sans-serif">8,147 RUNS</text></g>
    <g class="move1"><rect x="100" y="302" width="158" height="83" rx="7" class="panel"/><circle cx="122" cy="326" r="6" class="dot"/><text x="138" y="331" class="mono">dlq_8219</text><text x="116" y="362" class="muted">checkout.finalize</text>
      <rect x="290" y="326" width="158" height="83" rx="7" class="panel"/><circle cx="312" cy="350" r="6" class="dot"/><text x="328" y="355" class="mono">dlq_8220</text><text x="306" y="386" class="muted">checkout.finalize</text>
      <rect x="138" y="427" width="158" height="83" rx="7" class="panel"/><circle cx="160" cy="451" r="6" class="dot"/><text x="176" y="456" class="mono">dlq_8221</text><text x="154" y="487" class="muted">checkout.finalize</text>
      <rect x="338" y="445" width="158" height="83" rx="7" class="panel"/><circle cx="360" cy="469" r="6" class="dot"/><text x="376" y="474" class="mono">dlq_8222</text><text x="354" y="505" class="muted">checkout.finalize</text></g>
    <text x="615" y="370" class="muted">Retry / restart / resume?</text><text x="615" y="402" class="muted">Which runs share a cause?</text><text x="615" y="434" class="muted">Would a replay duplicate an effect?</text></g>
  <!-- phase 2: clustered incident -->
  <g class="phase2"><text x="95" y="224" class="small blue">02 / INCIDENT CLUSTERING</text><text x="95" y="257" class="label">Thousands of entries resolve into one shared failure boundary.</text><path d="M270 330 C420 330 440 330 545 330" class="line draw"/><path d="M270 470 C420 470 440 350 545 350" class="line draw"/>
    <rect x="554" y="289" width="438" height="222" rx="10" class="panel card"/><text x="587" y="329" class="small blue">INCIDENT DW-193</text><text x="587" y="370" class="label">checkout.finalize → payments-api/v3</text><text x="587" y="404" class="muted">Deployment: checkout-api@4f18c9</text><text x="587" y="435" class="muted">Failure signature confidence: 97.4%</text><rect x="587" y="458" width="203" height="27" rx="4" fill="#1c3550"/><text x="600" y="477" class="small blue">ONE PROBABLE CAUSE</text></g>
  <!-- phase 3: risk gate -->
  <g class="phase3"><text x="95" y="224" class="small amber">03 / REPLAY-RISK ANALYSIS</text><text x="95" y="257" class="label">Deadwire refuses to confuse uncertainty with safety.</text><rect x="105" y="302" width="423" height="185" rx="9" class="panel pulse"/><text x="136" y="341" class="small amber">STEP / CHARGE-CUSTOMER</text><text x="136" y="383" class="label">RETRY STATUS: UNSAFE</text><text x="136" y="416" class="muted">Previous attempt may have reached provider.</text><text x="136" y="445" class="muted">Idempotency key: not observed.</text><rect x="612" y="302" width="423" height="185" rx="9" class="panel pulse"/><text x="643" y="341" class="small blue">RECOVERY PLAN</text><text x="643" y="383" class="label amber">BLOCK / VERIFY TRANSACTION</text><text x="643" y="416" class="muted">Deploy compatibility fix first.</text><text x="643" y="445" class="muted">No unsafe resume is issued.</text><text x="105" y="540" class="small amber tag">EVIDENCE, NOT RETRY COUNT, DECIDES THE ACTION</text></g>
  <!-- phase 4: controlled recovery -->
  <g class="phase4"><text x="95" y="224" class="small green">04 / CONTROLLED RECOVERY</text><text x="95" y="257" class="label">Once evidence passes, recovery starts as a controlled wave.</text><g class="pulse"><rect x="110" y="330" width="122" height="74" rx="7" class="panel"/><text x="129" y="360" class="small blue">RECEIPT</text><text x="129" y="386" class="label">APPROVED</text><path d="M232 367 L300 367" class="line"/><rect x="300" y="330" width="122" height="74" rx="7" class="panel"/><text x="321" y="360" class="small blue">CANARY</text><text x="321" y="386" class="label">1%</text><path d="M422 367 L490 367" class="line"/><rect x="490" y="330" width="122" height="74" rx="7" class="panel"/><text x="512" y="360" class="small blue">OBSERVE</text><text x="512" y="386" class="label">CLEAN</text><path d="M612 367 L680 367" class="line"/><rect x="680" y="330" width="122" height="74" rx="7" class="panel"/><text x="704" y="360" class="small blue">RAMP</text><text x="704" y="386" class="label">CONTROLLED</text><path d="M802 367 L870 367" class="line"/><rect x="870" y="330" width="122" height="74" rx="7" class="panel"/><text x="892" y="360" class="small green">RECEIPT</text><text x="892" y="386" class="label">RECONCILED</text><rect x="299" y="429" width="510" height="7" rx="4" fill="#1d2a3a"/><rect x="299" y="429" width="110" height="7" rx="4" class="green scan"/><text x="341" y="478" class="muted">Mandatory flow control · halt on recurrence · original DLQ ID → resumed run ID</text></g></g>
  <text x="62" y="642" class="small">DEADWIRE MAKES UPSTASH RECOVERY CORRECTNESS A PRODUCT SURFACE</text>
</svg>
