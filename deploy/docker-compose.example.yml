services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deadwire
      POSTGRES_USER: deadwire
      POSTGRES_PASSWORD: change-me-before-use
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - deadwire-postgres:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  deadwire-postgres:
